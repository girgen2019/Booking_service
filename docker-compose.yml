version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: booking-service-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-bookingdb}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking-network

  app:
    build: .
    container_name: booking-service-app
    ports:
      - "${SERVER_PORT:-3080}:3080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-3080}
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-bookingdb}
      DB_PORT: 5432
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - booking-network
    command: sh -c "npm run migrate && npm run dev"

volumes:
  postgres_data:

networks:
  booking-network:
    driver: bridge

